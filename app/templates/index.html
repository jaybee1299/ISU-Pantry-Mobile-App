<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ISU School Pantry Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <h1>ISU School Pantry Assistant</h1>
    <p class="intro">
      Ask a question about pantry services, eligibility, registration, location,
      or volunteer opportunities.
    </p>

    <div class="quick-actions">
      <button data-question="Who can use the pantry?">Eligibility</button>
      <button data-question="Where is the pantry located?">Location</button>
      <button data-question="How can I volunteer?">Volunteer</button>
    </div>

    <label for="question">Your question</label>
    <textarea id="question" rows="4" placeholder="Example: How can I volunteer?"></textarea>
    <button id="ask">Ask Assistant</button>

    <section id="result" class="result hidden">
      <h2>Response</h2>
      <p id="answer"></p>
      <p id="source" class="source"></p>
    </section>
  </main>

<script>
const questionBox = document.getElementById("question");
const askButton = document.getElementById("ask");
const result = document.getElementById("result");
const answer = document.getElementById("answer");
const source = document.getElementById("source");

document.querySelectorAll("[data-question]").forEach(btn => {
  btn.addEventListener("click", () => {
    questionBox.value = btn.dataset.question;
  });
});

askButton.addEventListener("click", async () => {
  const question = questionBox.value.trim();
  if (!question) return;

  answer.textContent = "Searching verified pantry information...";
  source.textContent = "";
  result.classList.remove("hidden");

  const response = await fetch("/api/ask", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({question})
  });

  const data = await response.json();

  if (!response.ok) {
    answer.textContent = data.error || "Something went wrong.";
    return;
  }

  answer.textContent = data.answer;
  source.textContent = data.source ? `Source: ${data.source}` : "";
});
</script>
</body>
</html>
